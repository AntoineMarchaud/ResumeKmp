# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g
# iOS targets can only be built on macOS: skip them silently elsewhere.
kotlin.native.ignoreDisabledTargets=true

# Compose Multiplatform
# Hot Reload (desktop development tool) is not used by this project.
org.jetbrains.compose.hot.reload.disable=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
